<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaflet.TrackReplay — 时间序列回放 Demo</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../src/Leaflet.TrackReplay.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    #map { width: 100%; height: 100vh; }

    /* ---- Info overlay: top-left ---- */
    .info-overlay {
      position: absolute;
      top: 80px;
      left: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 8px;
      padding: 14px 18px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      min-width: 200px;
      font-size: 13px;
      line-height: 1.7;
      pointer-events: none;
    }
    .info-overlay .label { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .info-overlay .value { font-weight: 700; color: #333; font-size: 15px; }
    .info-overlay .time-value { font-family: 'SF Mono', 'Consolas', 'Monaco', monospace; font-size: 18px; font-weight: 700; color: #e65100; }
    .info-overlay hr { border: none; border-top: 1px solid #eee; margin: 8px 0; }

    /* ---- Control bar: bottom ---- */
    .control-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 10px 20px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
    }

    .control-bar label { font-weight: 600; color: #555; white-space: nowrap; }
    .control-bar input[type="range"] { width: 120px; accent-color: #ff5722; }

    .badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge.play  { background: #d4edda; color: #155724; }
    .badge.pause { background: #fff3cd; color: #856404; }
    .badge.done  { background: #d6d8f8; color: #2a2d8a; }

    .btn {
      padding: 5px 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: #f5f5f5; border-color: #999; }
    .btn.active { background: #ff5722; color: #fff; border-color: #ff5722; }

    /* ---- Mobile tweaks ---- */
    @media (max-width: 700px) {
      .control-bar { flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
      .info-overlay { top: 70px; left: 8px; padding: 10px 14px; min-width: 160px; }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Time / info overlay -->
  <div class="info-overlay">
    <div class="label">🕐 当前回放时间</div>
    <div class="time-value" id="timeDisplay">--:--:--</div>
    <hr>
    <div class="label">📍 坐标</div>
    <div class="value" id="coordDisplay">—</div>
    <hr>
    <div class="label">📏 已走 / 全程</div>
    <div class="value" id="distDisplay">—</div>
  </div>

  <!-- Bottom control bar -->
  <div class="control-bar">
    <button class="btn" id="playPauseBtn">▶ Play</button>
    <button class="btn" id="restartBtn">↺ 重播</button>
    <label for="speedSlider">⏩</label>
    <input type="range" id="speedSlider" min="1" max="500" value="30" step="1">
    <span id="speedVal" style="font-weight:700;min-width:42px;text-align:center;">30×</span>
    <span class="badge pause" id="statusBadge">等待中</span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../src/Leaflet.TrackReplay.js"></script>

  <script>
  (function () {
    'use strict';

    // =========================================================================
    // 1. 地图
    // =========================================================================
    var map = L.map('map').setView([31.2304, 121.4737], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap',
    }).addTo(map);

    // =========================================================================
    // 2. 生成带不规律时间戳的模拟轨迹
    //    模拟一辆车在上海外滩附近行驶约 25 分钟的真实场景
    // =========================================================================
    var waypoints = [
      { lat: 31.2350, lng: 121.4800, label: '起点 — 外滩观景平台' },
      { lat: 31.2370, lng: 121.4820, label: '南京东路步行街口' },
      { lat: 31.2340, lng: 121.4850, label: '中山东一路南段' },
      { lat: 31.2300, lng: 121.4830, label: '延安东路路口' },
      { lat: 31.2280, lng: 121.4790, label: '人民路隧道入口' },
      { lat: 31.2250, lng: 121.4750, label: '豫园' },
      { lat: 31.2220, lng: 121.4780, label: '复兴东路' },
      { lat: 31.2190, lng: 121.4820, label: '董家渡' },
      { lat: 31.2140, lng: 121.4800, label: '南浦大桥北' },
      { lat: 31.2090, lng: 121.4770, label: '南浦大桥' },
      { lat: 31.2040, lng: 121.4730, label: '世博园区北' },
      { lat: 31.2000, lng: 121.4700, label: '终点 — 世博公园' },
    ];

    // 生成轨迹点：在路点之间插值，加上不规律的时间间隔
    var trackData = [];
    var baseTime = Date.now() - 30 * 60000; // 从 30 分钟前开始

    for (var w = 0; w < waypoints.length - 1; w++) {
      var from = waypoints[w];
      var to = waypoints[w + 1];
      var steps = 4 + Math.floor(Math.random() * 4); // 4–7 个子点

      for (var s = 0; s < steps; s++) {
        var t = s / steps;
        var lat = from.lat + (to.lat - from.lat) * t;
        var lng = from.lng + (to.lng - from.lng) * t;

        // 不规律的时间间隔：30–90 秒
        var timeGap = (30 + Math.random() * 60) * 1000;
        var prevTime = trackData.length > 0
          ? trackData[trackData.length - 1].time
          : baseTime;

        trackData.push({
          lat: +lat.toFixed(6),
          lng: +lng.toFixed(6),
          time: prevTime + timeGap,
        });
      }
    }

    // 确保最后一个路点精确收录
    var last = waypoints[waypoints.length - 1];
    var prevTime = trackData[trackData.length - 1].time;
    trackData.push({
      lat: last.lat,
      lng: last.lng,
      time: prevTime + 45000,
    });

    console.log(
      '生成轨迹: ' + trackData.length + ' 个点, ' +
      '时间跨度 ' + ((trackData[trackData.length - 1].time - trackData[0].time) / 60000).toFixed(1) + ' 分钟'
    );

    // =========================================================================
    // 3. 初始化插件
    // =========================================================================
    var startTimestamp = trackData[0].time;
    var endTimestamp   = trackData[trackData.length - 1].time;

    var replay = L.trackReplay(trackData, {
      speed: 30,
      fitBounds: true,
      fitBoundsPadding: [40, 40],
      fitBoundsMaxZoom: 15,
      autoRotate: true,
      loop: false,

      trackStyle: {
        color: '#b0bec5',
        weight: 4,
        opacity: 0.45,
      },
      elapsedStyle: {
        color: '#ff5722',
        weight: 5,
        opacity: 0.95,
      },
    }).addTo(map);

    // =========================================================================
    // 4. 时间序列 HUD 更新
    // =========================================================================
    var timeDisplay  = document.getElementById('timeDisplay');
    var coordDisplay = document.getElementById('coordDisplay');
    var distDisplay  = document.getElementById('distDisplay');
    var statusBadge  = document.getElementById('statusBadge');
    var playPauseBtn = document.getElementById('playPauseBtn');

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function formatTime(ts) {
      var d = new Date(ts);
      return d.getFullYear() + '-' +
        pad(d.getMonth() + 1) + '-' +
        pad(d.getDate()) + ' ' +
        pad(d.getHours()) + ':' +
        pad(d.getMinutes()) + ':' +
        pad(d.getSeconds());
    }

    function updateHUD() {
      // 当前回放时间（根据进度在首尾时间戳之间插值）
      var progress = replay.getProgress();
      var currentTs = startTimestamp + (endTimestamp - startTimestamp) * progress;
      timeDisplay.textContent = formatTime(currentTs);

      // 坐标
      var pos = replay.getLatLng();
      if (pos) {
        coordDisplay.textContent = pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5);
      }

      // 距离
      var totalKm = (replay._totalDistance / 1000).toFixed(2);
      var elapsedKm = (replay._elapsedDistance / 1000).toFixed(2);
      distDisplay.textContent = elapsedKm + ' / ' + totalKm + ' km';
    }

    // 每 200ms 刷新 HUD（不依赖动画帧，pause 时也能更新）
    var hudTimer = null;
    function startHUD() {
      if (hudTimer) { return; }
      hudTimer = setInterval(updateHUD, 200);
    }
    function stopHUD() {
      clearInterval(hudTimer);
      hudTimer = null;
    }

    // =========================================================================
    // 5. 事件绑定
    // =========================================================================
    replay.on('start', function () {
      statusBadge.textContent = '播放中';
      statusBadge.className = 'badge play';
      playPauseBtn.textContent = '⏸ Pause';
      playPauseBtn.classList.add('active');
      startHUD();
    });

    replay.on('pause', function () {
      statusBadge.textContent = '已暂停';
      statusBadge.className = 'badge pause';
      playPauseBtn.textContent = '▶ Play';
      playPauseBtn.classList.remove('active');
      updateHUD(); // final update at pause position
    });

    replay.on('stop', function () {
      statusBadge.textContent = '已停止';
      statusBadge.className = 'badge pause';
      playPauseBtn.textContent = '▶ Play';
      playPauseBtn.classList.remove('active');
      updateHUD();
      stopHUD();
    });

    replay.on('finish', function () {
      statusBadge.textContent = '已完成';
      statusBadge.className = 'badge done';
      playPauseBtn.textContent = '↻ Replay';
      playPauseBtn.classList.add('active');
      updateHUD();
      stopHUD();
    });

    // =========================================================================
    // 6. 控制按钮
    // =========================================================================
    playPauseBtn.addEventListener('click', function () {
      if (replay.isFinished()) {
        replay.stop();
        replay.start();
      } else if (replay.isPlaying()) {
        replay.pause();
      } else {
        replay.start();
      }
    });

    document.getElementById('restartBtn').addEventListener('click', function () {
      replay.stop();
      updateHUD();
      replay.start();
    });

    var speedSlider = document.getElementById('speedSlider');
    var speedVal    = document.getElementById('speedVal');
    speedSlider.addEventListener('input', function () {
      var v = parseInt(this.value, 10);
      speedVal.textContent = v + '×';
      replay.setSpeed(v);
    });

    // =========================================================================
    // 7. 启动
    // =========================================================================
    updateHUD();
    setTimeout(function () { replay.start(); }, 600);

  })();
  </script>
</body>
</html>
