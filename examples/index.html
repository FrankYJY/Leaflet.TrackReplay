<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaflet.TrackReplay — Demo</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Plugin CSS (use the built version for production) -->
  <link rel="stylesheet" href="../src/Leaflet.TrackReplay.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    #map {
      width: 100%;
      height: 100vh;
    }

    .demo-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 12px 18px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .demo-panel label {
      font-weight: 600;
      color: #555;
    }

    .demo-panel input[type="range"] {
      width: 100px;
    }

    .demo-panel .speed-val {
      display: inline-block;
      min-width: 36px;
      text-align: center;
      font-weight: 700;
      color: #333;
    }

    .demo-panel .status {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .demo-panel .status.playing { background: #d4edda; color: #155724; }
    .demo-panel .status.paused  { background: #fff3cd; color: #856404; }
    .demo-panel .status.stopped { background: #f8d7da; color: #721c24; }
    .demo-panel .status.finished { background: #d6d8f8; color: #2a2d8a; }

    .demo-panel button {
      padding: 4px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s;
    }
    .demo-panel button:hover { background: #f0f0f0; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Demo control bar -->
  <div class="demo-panel">
    <button id="restartBtn">↺ Restart</button>
    <label for="speedSlider">⏩ Speed:</label>
    <input type="range" id="speedSlider" min="1" max="200" value="20" step="1">
    <span class="speed-val" id="speedVal">20×</span>
    <span class="status paused" id="statusBadge">paused</span>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Plugin JS (use the built version for production) -->
  <script src="../src/Leaflet.TrackReplay.js"></script>

  <script>
    (function () {
      'use strict';

      // ---- Initialize map ---------------------------------------------------
      var map = L.map('map').setView([39.9042, 116.4074], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map);

      // ---- Generate sample track data ---------------------------------------
      // ~20 points, 5-second intervals → 95 virtual seconds total
      // At 20× speed → completes in ~5 real seconds (clearly visible)
      function generateTrack(centerLat, centerLng, numPoints, radius) {
        var points = [];
        var baseTime = Date.now() - 300000; // Started 5 minutes ago

        for (var i = 0; i < numPoints; i++) {
          var angle = (i / numPoints) * Math.PI * 2;
          // Spiral: starts tight, expands outward
          var r = radius * (0.3 + 0.7 * i / numPoints);
          var lat = centerLat + (r / 111320) * Math.cos(angle);
          var lng = centerLng + (r / (111320 * Math.cos(centerLat * Math.PI / 180))) * Math.sin(angle);

          points.push({
            lat: lat,
            lng: lng,
            time: baseTime + i * 5000, // 5 seconds between points
          });
        }
        return points;
      }

      var trackData = generateTrack(39.9042, 116.4074, 20, 1500);

      // ---- Initialize TrackReplay -------------------------------------------
      var replay = L.trackReplay(trackData, {
        speed: 20,
        fitBounds: true,
        fitBoundsPadding: [50, 50],
        fitBoundsMaxZoom: 15,
        autoRotate: true,

        // Custom track appearance
        trackStyle: {
          color: '#888888',
          weight: 3,
          opacity: 0.5,
        },
        elapsedStyle: {
          color: '#ff5722',
          weight: 4,
          opacity: 0.9,
        },
      }).addTo(map);

      // ---- Status badge -----------------------------------------------------
      var statusBadge = document.getElementById('statusBadge');

      function setStatus(text, cls) {
        statusBadge.textContent = text;
        statusBadge.className = 'status ' + cls;
      }

      // ---- Event listeners --------------------------------------------------
      replay.on('start', function () {
        setStatus('playing', 'playing');
      });

      replay.on('pause', function () {
        setStatus('paused', 'paused');
      });

      replay.on('stop', function () {
        setStatus('stopped', 'stopped');
      });

      replay.on('finish', function () {
        setStatus('finished', 'finished');
      });

      // ---- Speed slider -----------------------------------------------------
      var slider = document.getElementById('speedSlider');
      var speedVal = document.getElementById('speedVal');

      slider.addEventListener('input', function () {
        var val = parseInt(this.value, 10);
        speedVal.textContent = val + '×';
        replay.setSpeed(val);
      });

      // ---- Restart button ---------------------------------------------------
      document.getElementById('restartBtn').addEventListener('click', function () {
        replay.stop();
        replay.start();
      });

      // ---- Click the control's play button to start (more intuitive) --------
      // Auto-start after a short delay so the user sees the track appear first
      setTimeout(function () {
        replay.start();
      }, 500);

    })();
  </script>
</body>
</html>
